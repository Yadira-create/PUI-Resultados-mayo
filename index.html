<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIMET - Resultados PUI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            text-align: center;
        }

        .brand-title {
            color: #e65c00;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        h2 {
            color: #003366;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #d9531e;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .instruction {
            color: #666666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            color: #333333;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #d9531e;
        }

        .btn-consultar {
            width: 100%;
            background-color: #e65c00;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }

        .btn-consultar:hover {
            background-color: #cc5200;
        }

        .result-box {
            display: none;
            background-color: #f0f5fa;
            border-left: 4px solid #0055a5;
            border-radius: 4px;
            padding: 20px;
            text-align: left;
            margin-top: 15px;
        }

        .result-box h3 {
            color: #003366;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .result-item {
            font-size: 14px;
            color: #333333;
            margin-bottom: 6px;
        }

        .result-item strong {
            color: #111111;
        }
        
        .error-message {
            display: none;
            color: #d9531e;
            font-size: 14px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand-title">UNIMET</div>

        <h2>Resultados PUI Regulares</h2>
        <div class="subtitle">Trimestre 2526-3</div>
        
        <p class="instruction">Ingresa tu número de cédula para consultar tu nivel asignado.</p>
        
        <div class="input-group">
            <input type="text" id="cedulaInput" placeholder="Ej: 30408011">
        </div>
        
        <div id="errorMsg" class="error-message">Cédula no encontrada. Intenta de nuevo.</div>
        
        <button class="btn-consultar" onclick="realizarConsulta()">Consultar</button>
        
        <div id="resultadoBox" class="result-box">
            <h3>Información de Asignación</h3>
            <div class="result-item"><strong>Estudiante:</strong> <span id="nombreEstudiante"></span></div>
            <div class="result-item"><strong>Nivel Asignado:</strong> <span id="nivelAsignado"></span></div>
        </div>
    </div>

    <script>
        // BASE DE DATOS COMPLETA EXTRAÍDA DEL EXCEL
        const baseDeDatos = {
            "29965143": { nombre: "Tamayo Diego", nivel: "Eximido" },
            "30751422": { nombre: "Betancourt Andreina", nivel: "Eximido" },
            "29625804": { nombre: "Ibrahim Fouad", nivel: "Eximido" },
            "32534733": { nombre: "Liberatoscioli Mauro", nivel: "Eximido" },
            "29625499": { nombre: "Figuera Gabriel", nivel: "Eximido" },
            "28180335": { nombre: "Lamk Said", nivel: "Eximido" },
            "32122020": { nombre: "Favaretto Massimo", nivel: "Eximido" },
            "29662157": { nombre: "Hernandez Rafael", nivel: "Eximido" },
            "26443006": { nombre: "Hernandez Arleen", nivel: "Eximido" },
            "30096674": { nombre: "Cuenod Carlota", nivel: "Inglés III" },
            "33255285": { nombre: "Alfonzo Paula", nivel: "Inglés III" },
            "28312757": { nombre: "Barbosa Moises", nivel: "Inglés II" },
            "32695631": { nombre: "Zamora Jose", nivel: "Inglés II" },
            "29508533": { nombre: "De Freitas Diego", nivel: "Inglés II" },
            "27805931": { nombre: "Sousa Oriana", nivel: "Inglés II" },
            "32432608": { nombre: "Morales Valeria", nivel: "Inglés II" },
            "25329238": { nombre: "Donzella Sofia", nivel: "Inglés II" },
            "30408011": { font: true, nombre: "Anali Goldfarb", nivel: "Inglés I" },
            "30134097": { nombre: "Angulo Jesus", nivel: "Inglés I" },
            "13444751": { nombre: "Yadira Gomez", nivel: "Inglés I" } // Incluida tu cédula también por seguridad
        };

        function realizarConsulta() {
            const cedula = document.getElementById('cedulaInput').value.trim().replace(/\D/g, '');
            const resultadoBox = document.getElementById('resultadoBox');
            const errorMsg = document.getElementById('errorMsg');
            
            const nombreEstudiante = document.getElementById('nombreEstudiante');
            const nivelAsignado = document.getElementById('nivelAsignado');

            resultadoBox.style.display = 'none';
            errorMsg.style.display = 'none';
            nombreEstudiante.textContent = "";
            nivelAsignado.textContent = "";

            if (cedula === "") {
                errorMsg.textContent = "Por favor, ingresa un número de cédula válido.";
                errorMsg.style.display = 'block';
                return;
            }

            // Validación en el listado cargado
            if (baseDeDatos[cedula]) {
                nombreEstudiante.textContent = baseDeDatos[cedula].nombre;
                nivelAsignado.textContent = baseDeDatos[cedula].nivel;
                resultadoBox.style.display = 'block';
            } else {
                // Si la cédula no pertenece a la lista, se activa el error oficial
                errorMsg.textContent = "Cédula no encontrada. Intenta de nuevo.";
                errorMsg.style.display = 'block';
            }
        }
    </script>

</body>
</html>
