<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIMET - Resultados PUI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 100%; max-width: 450px; padding: 40px 30px; text-align: center; }
        h2 { color: #003366; font-size: 24px; font-weight: 700; margin-top: 15px; margin-bottom: 5px; } /* Ajuste de margen superior */
        .subtitle { color: #d9531e; font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 25px; }
        .instruction { color: #666666; font-size: 14px; margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #cccccc; border-radius: 6px; font-size: 16px; text-align: center; color: #333333; }
        .btn-consultar { width: 100%; background-color: #e65c00; color: white; border: none; border-radius: 6px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 30px; }
        .result-box { background-color: #f0f5fa; border-left: 4px solid #0055a5; border-radius: 4px; padding: 20px; text-align: left; }
    </style>
</head>
<body>
    <div class="card">
        <!-- El bloque de imagen rota fue ELIMINADO -->
        <h2>UNIMET - Resultados PUI Regulares</h2> <!-- Pequeño cambio de texto -->
        <div class="subtitle">Trimestre 2526-3</div>
        <p class="instruction">Ingresa tu número de cédula para consultar tu nivel asignado.</p>
        <div class="input-group"><input type="text" value="Ej: 30408011"></div>
        <button class="btn-consultar">Consultar</button>
        <div class="result-box"><h3>Información de Asignación</h3></div>
    </div>
</body>
</html>
