<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIMET - Resultados PUI</title>
    <style>
        :root {
            --unimet-blue: #003874;
            --unimet-orange: #E86014;
            --background-gray: #F4F6F9;
            --text-dark: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-gray);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: var(--unimet-blue);
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 5px 0;
        }

        .subtitle {
            color: var(--unimet-orange);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .instruction {
            color: #666666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1.5px solid #E0E0E0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            text-align: center;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--unimet-orange);
            box-shadow: 0 0 0 3px rgba(232, 96, 20, 0.15);
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--unimet-orange);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #CD500E;
        }

        button:active {
            transform: scale(0.99);
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
        }

        .success {
            background-color: #F0F7FF;
            border-left: 4px solid var(--unimet-blue);
            color: #1A365D;
        }

        .error {
            background-color: #FFF5F5;
            border-left: 4px solid #E53E3E;
            color: #742A2A;
        }

        .result-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 6px;
            color: var(--unimet-blue);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Resultados PUI Regulares</h1>
    <div class="subtitle">Trimestre 2526-3</div>
    
    <p class="instruction">Ingresa tu número de cédula para consultar tu nivel asignado.</p>
    
    <div class="form-group">
        <input type="text" id="cedulaInput" placeholder="Ej: 30408011" autocomplete="off">
    </div>
    
    <button onclick="buscarResultado()">Consultar</button>
    
    <div id="result" class="result-box"></div>
</div>

<script>
    // Base de datos de estudiantes extraída de "Resultados PUI 2526-3 mayo.xlsx"
    const estudiantes = {
        "29965143": { nombre: "Diego Tamayo", curso: "Eximido", i4: "20", i5: "20" },
        "30751422": { nombre: "Andreina Betancourt", curso: "Eximido", i4: "20", i5: "20" },
        "29625804": { nombre: "Fouad Ibrahim", curso: "Eximido", i4: "20", i5: "20" },
        "32534733": { nombre: "Mauro Liberatoscioli", curso: "Eximido", i4: "20", i5: "20" },
        "29625499": { nombre: "Gabriel Figuera", curso: "Eximido", i4: "20", i5: "20" },
        "28180335": { nombre: "Said Lamk", curso: "Eximido", i4: "20", i5: "20" },
        "32122020": { nombre: "Massimo Favaretto", curso: "Eximido", i4: "20", i5: "20" },
        "29662157": { nombre: "Rafael Hernandez", curso: "Eximido", i4: "20", i5: "20" },
        "26443006": { nombre: "Arleen Hernandez", curso: "Eximido", i4: "20", i5: "20" },
        "30096674": { nombre: "Carlota Cuenod", curso: "Inglés III", i4: "-", i5: "-" },
        "33255285": { nombre: "Paula Alfonzo", curso: "Inglés III", i4: "-", i5: "-" },
        "28312757": { nombre: "Moises Barbosa", curso: "Inglés II", i4: "-", i5: "-" },
        "32695631": { nombre: "Jose Zamora", curso: "Inglés II", i4: "-", i5: "-" },
        "29508533": { nombre: "Diego De Freitas", curso: "Inglés II", i4: "-", i5: "-" },
        "27805931": { nombre: "Oriana Sousa", curso: "Inglés II", i4: "-", i5: "-" },
        "32432608": { nombre: "Valeria Morales", curso: "Inglés II", i4: "-", i5: "-" },
        "25329238": { nombre: "Sofia Donzella", curso: "Inglés II", i4: "-", i5: "-" },
        "30408011": { nombre: "Anali Goldfarb", curso: "Inglés I", i4: "-", i5: "-" },
        "30134097": { nombre: "Jesus Angulo", curso: "Inglés I", i4: "-", i5: "-" }
    };

    function buscarResultado() {
        const input = document.getElementById('cedulaInput').value.trim();
        const resultBox = document.getElementById('result');
        
        // Limpia puntos o espacios que introduzca el estudiante
        const cedula = input.replace(/\./g, '').replace(/\s/g, '');

        if (cedula === "") {
            resultBox.className = "result-box error";
            resultBox.innerHTML = "Por favor, ingresa un número de cédula.";
            resultBox.style.display = "block";
            return;
        }

        if (estudiantes[cedula]) {
            const estudiante = estudiantes[cedula];
            resultBox.className = "result-box success";
            
            let detalles = `
                <div class="result-title">Información de Asignación</div>
                <strong>Estudiante:</strong> ${estudiante.nombre}<br>
                <strong>Nivel Asignado:</strong> ${estudiante.curso}
            `;
            
            if (estudiante.curso === "Eximido") {
                detalles += `<br><strong>Nota Inglés IV:</strong> ${estudiante.i4}<br><strong>Nota Inglés V:</strong> ${estudiante.i5}`;
            }
            
            resultBox.innerHTML = detalles;
        } else {
            resultBox.className = "result-box error";
            resultBox.innerHTML = `<div class="result-title">No Encontrado</div>La cédula <strong>${cedula}</strong> no está registrada para este período.`;
        }
        
        resultBox.style.display = "block";
    }

    // Ejecuta la consulta al presionar la tecla Enter
    document.getElementById("cedulaInput").addEventListener("keyup", function(event) {
        if (event.key === "Enter") {
            buscarResultado();
        }
    });
</script>

</body>
</html>
