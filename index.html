    <style>
        :root {
            --unimet-blue: #003874;
            --unimet-orange: #E86014;
            --background-gray: #F4F6F9;
            --text-dark: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-gray);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-sizing: border-box;
        }

        .logo-unimet {
            max-width: 180px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--unimet-blue);
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 5px 0;
        }

        .subtitle {
            color: var(--unimet-orange);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .instruction {
            color: #666666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1.5px solid #E0E0E0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            text-align: center;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--unimet-orange);
            box-shadow: 0 0 0 3px rgba(232, 96, 20, 0.15);
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--unimet-orange);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #CD500E;
        }

        button:active {
            transform: scale(0.99);
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
        }

        .success {
            background-color: #F0F7FF;
            border-left: 4px solid var(--unimet-blue);
            color: #1A365D;
        }

        .error {
            background-color: #FFF5F5;
            border-left: 4px solid #E53E3E;
            color: #742A2A;
        }

        .result-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 6px;
            color: var(--unimet-blue);
        }
    </style>
</head>

    function buscarResultado() {
        const input = document.getElementById('cedulaInput').value.trim();
        const resultBox = document.getElementById('result');
        
        const cedula = input.replace(/\./g, '').replace(/,/g, '').replace(/\s/g, '');

        if (cedula === "") {
            resultBox.className = "result-box error";
            resultBox.innerHTML = "Por favor, ingresa un número de cédula.";
            resultBox.style.display = "block";
            return;
        }

        if (estudiantes[cedula]) {
            const estudiante = estudiantes[cedula];
            resultBox.className = "result-box success";
            
            let detalles = `
                <div class="result-title">Información de Asignación</div>
                <strong>Estudiante:</strong> ${estudiante.nombre}<br>
                <strong>Nivel Asignado:</strong> ${estudiante.curso}
            `;
            
            if (estudiante.curso === "Eximido") {
                detalles += `<br><strong>Nota Inglés IV:</strong> ${estudiante.i4}<br><strong>Nota Inglés V:</strong> ${estudiante.i5}`;
            }
            
            resultBox.innerHTML = detalles;
        } else {
            resultBox.className = "result-box error";
            resultBox.innerHTML = `<div class="result-title">No Encontrado</div>La cédula <strong>${cedula}</strong> no está registrada para este período.`;
        }
        
        resultBox.style.display = "block";
    }

    document.getElementById("cedulaInput").addEventListener("keyup", function(event) {
        if (event.key === "Enter") {
            buscarResultado();
        }
    });
