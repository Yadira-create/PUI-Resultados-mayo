<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados PUI 2526-3 - Inglés</title>
    <style>
        :root {
            --primary-color: #003366;
            --secondary-color: #f4f4f9;
            --text-color: #333;
            --accent-color: #0088cc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #002244;
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            text-align: left;
            font-size: 15px;
            line-height: 1.5;
        }

        .success {
            background-color: #e6f4ea;
            border: 1px solid #137333;
            color: #137333;
        }

        .error {
            background-color: #fce8e6;
            border: 1px solid #c5221f;
            color: #c5221f;
        }

        .result-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
            border-bottom: 1px solid currentColor;
            padding-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Consulta de Resultados PUI</h1>
    <p class="subtitle">Período 2526-3 - Ubicación de Inglés</p>
    
    <div class="form-group">
        <label for="cedulaInput">Número de Cédula:</label>
        <input type="text" id="cedulaInput" placeholder="Ej: 29965143" autocomplete="off">
    </div>
    
    <button onclick="buscarResultado()">Consultar</button>
    
    <div id="result" class="result-box"></div>
</div>

<script>
    // Base de datos de estudiantes cargada desde el CSV provisto
    const estudiantes = {
        "29965143": { nombre: "Diego Tamayo", curso: "Eximido", i4: "20", i5: "20" },
        "30751422": { nombre: "Andreina Betancourt", curso: "Eximido", i4: "20", i5: "20" },
        "29625804": { nombre: "Fouad Ibrahim", curso: "Eximido", i4: "20", i5: "20" },
        "32534733": { nombre: "Mauro Liberatoscioli", curso: "Eximido", i4: "20", i5: "20" },
        "29625499": { font: "Gabriel Figuera", curso: "Eximido", i4: "20", i5: "20" },
        "28180335": { nombre: "Said Lamk", curso: "Eximido", i4: "20", i5: "20" },
        "32122020": { nombre: "Massimo Favaretto", curso: "Eximido", i4: "20", i5: "20" },
        "29662157": { nombre: "Rafael Hernandez", curso: "Eximido", i4: "20", i5: "20" },
        "26443006": { nombre: "Arleen Hernandez", curso: "Eximido", i4: "20", i5: "20" },
        "30096674": { nombre: "Carlota Cuenod", curso: "Inglés III", i4: "-", i5: "-" },
        "33255285": { nombre: "Paula Alfonzo", curso: "Inglés III", i4: "-", i5: "-" },
        "28312757": { nombre: "Moises Barbosa", curso: "Inglés II", i4: "-", i5: "-" },
        "32695631": { nombre: "Jose Zamora", curso: "Inglés II", i4: "-", i5: "-" },
        "29508533": { nombre: "Diego De Freitas", curso: "Inglés II", i4: "-", i5: "-" },
        "27805931": { nombre: "Oriana Sousa", curso: "Inglés II", i4: "-", i5: "-" },
        "32432608": { nombre: "Valeria Morales", curso: "Inglés II", i4: "-", i5: "-" },
        "25329238": { nombre: "Sofia Donzella", curso: "Inglés II", i4: "-", i5: "-" },
        "30408011": { nombre: "Anali Goldfarb", curso: "Inglés I", i4: "-", i5: "-" },
        "30134097": { nombre: "Jesus Angulo", curso: "Inglés I", i4: "-", i5: "-" }
    };

    function buscarResultado() {
        const input = document.getElementById('cedulaInput').value.trim();
        const resultBox = document.getElementById('result');
        
        // Limpiar puntos o espacios comunes que un estudiante pueda ingresar
        const cedula = input.replace(/\./g, '').replace(/\s/g, '');

        if (cedula === "") {
            resultBox.className = "result-box error";
            resultBox.innerHTML = "Por favor, ingresa un número de cédula.";
            resultBox.style.display = "block";
            return;
        }

        if (estudiantes[cedula]) {
            const estudiante = estudiantes[cedula];
            resultBox.className = "result-box success";
            
            let detalles = `
                <div class="result-title">Resultado Encontrado</div>
                <strong>Estudiante:</strong> ${estudiante.nombre || estudiante.font}<br>
                <strong>Asignación:</strong> ${estudiante.curso}
            `;
            
            if (estudiante.curso === "Eximido") {
                detalles += `<br><strong>Nota Inglés IV:</strong> ${estudiante.i4}<br><strong>Nota Inglés V:</strong> ${estudiante.i5}`;
            }
            
            resultBox.innerHTML = detalles;
        } else {
            resultBox.className = "result-box error";
            resultBox.innerHTML = `<div class="result-title">No Encontrado</div>La cédula <strong>${cedula}</strong> no se encuentra registrada en los resultados de este período.`;
        }
        
        resultBox.style.display = "block";
    }

    // Permitir presionar "Enter" para buscar
    document.getElementById("cedulaInput").addEventListener("keyup", function(event) {
        if (event.key === "Enter") {
            buscarResultado();
        }
    });
</script>

</body>
</html>
