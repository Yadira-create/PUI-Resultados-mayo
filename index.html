    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            text-align: center;
        }

        /* Encabezado tipográfico limpio y seguro que reemplaza al logo */
        .brand-header {
            color: #e65c00;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        h2 {
            color: #003366;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #d9531e;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .instruction {
            color: #666666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            color: #333333;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #d9531e;
        }

        .btn-consultar {
            width: 100%;
            background-color: #e65c00;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }

        .btn-consultar:hover {
            background-color: #cc5200;
        }

        .result-box {
            display: none;
            background-color: #f0f5fa;
            border-left: 4px solid #0055a5;
            border-radius: 4px;
            padding: 20px;
            text-align: left;
            margin-top: 15px;
        }

        .result-box h3 {
            color: #003366;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .result-item {
            font-size: 14px;
            color: #333333;
            margin-bottom: 6px;
        }

        .result-item strong {
            color: #111111;
        }
        
        .error-message {
            display: none;
            color: #d9531e;
            font-size: 14px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
